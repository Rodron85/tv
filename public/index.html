<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forreta TV">
<title>Forreta TV</title>
<link rel="icon" id="favicon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
:root{
  --bg:#08090b; --panel:#121418; --card:#1a1d23; --line:#2a2f38;
  --text:#f5f6f8; --muted:#a3abb7; --green:#f0353b; --yellow:#ffffff; --red:#f0353b;
  --pad:4vw;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus{outline:none}
.nav:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* ---------- top bar ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) var(--pad) 8px;background:linear-gradient(#08090bf5,#08090bdd 70%,#08090b00);transition:background .3s}
#top.solid{background:#08090bf7;box-shadow:0 2px 14px #0009}
.tb{display:flex;align-items:center;gap:14px}
.brand{background:none;border:0;padding:0;display:flex;border-radius:12px}
.brand svg{width:46px;height:46px}
.ttl{font-size:clamp(26px,3vw,36px);font-weight:800;letter-spacing:-.5px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.ib svg{width:28px;height:28px}
.chips-top{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:12px var(--pad) 4px;margin:0 calc(-1 * var(--pad))}
.chips-top::-webkit-scrollbar{display:none}
.chips-top button{flex:none;background:#ffffff12;border:1.5px solid #ffffff30;color:#e5e7eb;border-radius:999px;padding:10px 20px;font-weight:700;font-size:16px;white-space:nowrap}
.chips-top button.on{background:#fff;color:#000;border-color:#fff}
body.notv .chips-top{display:none}

/* ---------- bottom bar ---------- */
#bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;
  background:#22252bea;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #ffffff1c;border-radius:999px;padding:6px;box-shadow:0 12px 34px #000b;width:min(560px,calc(100% - 24px))}
#bnav button{flex:1;background:none;border:0;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;color:#b9bfc9;font-size:13px;font-weight:600}
#bnav svg{width:26px;height:26px}
#bnav button.on{background:#ffffff1f;color:#fff}
body{padding-bottom:110px}

/* ---------- profiles + intro ---------- */
.ovl{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:#08090b;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.ovl.show{display:flex}
#profiles h1{font-size:clamp(28px,4vw,48px);font-weight:800;margin:0 0 34px}
.pgrid{display:flex;gap:clamp(24px,6vw,70px)}
.prof{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:14px;color:#aab0b9;font-size:clamp(18px,2vw,24px)}
.prof b{font-weight:600}
.pav{width:clamp(120px,22vw,200px);aspect-ratio:1;border-radius:14px;display:flex;overflow:hidden;border:4px solid transparent;transition:transform .2s,border-color .2s}
.pav svg{width:100%;height:100%;display:block}
.pav.adult{background:#0b0d10}
.prof:hover,.prof:focus-visible{color:#fff;outline:none}
.prof:hover .pav,.prof:focus-visible .pav{border-color:#fff;transform:scale(1.06)}
.pin{margin-top:30px;display:none}
.pin.show{display:block}
.pin input{font-size:28px;letter-spacing:10px;text-align:center;width:220px;padding:10px;border-radius:10px;border:2px solid #444;background:#111;color:#fff}
.pin .r{display:flex;gap:10px;justify-content:center;margin-top:14px}
#pinMsg{color:#ff8a8a;min-height:22px}
#intro{background:#000;overflow:hidden;cursor:pointer;z-index:90}
.ibox{display:flex;align-items:center;gap:16px;opacity:0;position:relative}
#intro.play .ibox{animation:iin 2.7s cubic-bezier(.2,.8,.2,1) forwards}
.ilogo{width:clamp(70px,12vw,140px);height:clamp(70px,12vw,140px)}
.iword{font-weight:900;font-size:clamp(40px,8vw,96px);letter-spacing:-3px}
.iword span{color:var(--green);margin-left:6px}
.rays{position:absolute;top:-30%;right:-30%;bottom:-30%;left:-30%;background:repeating-conic-gradient(from 0deg,#f0353b2e 0deg 3deg,transparent 3deg 11deg);opacity:0}
#intro.play .rays{animation:rays 2.7s ease-out forwards}
@keyframes iin{0%{opacity:0;transform:scale(.55);filter:blur(14px)}22%{opacity:1;transform:scale(1);filter:blur(0)}70%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(3.4);filter:blur(8px)}}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.5)}30%{opacity:1}100%{opacity:0;transform:rotate(50deg) scale(1.7)}}
.mini{width:32px;height:32px;border-radius:6px;overflow:hidden;display:block}
.mini svg{width:100%;height:100%;display:block}

/* ---------- kids profile ---------- */
.kb{display:none!important}
body.kids #bnav button{display:none}
body.kids #bnav .kb{display:flex!important}
body.kids .ad,body.kids .chips-top{display:none}
body.kids{--bg:#0d1b3d;background:#0d1b3d}
body.kids #top{background:linear-gradient(#0d1b3df7,#0d1b3dd9 70%,#0d1b3d00)}
body.kids #top.solid{background:#0d1b3df7}
body.kids .card{width:clamp(210px,44vw,340px);border-radius:16px}
body.kids .card .lab{font-size:16px}
body.kids #bFav{display:none}
.kh{font-size:clamp(20px,2vw,26px);font-weight:900;margin:26px 0 14px}
body.kids .grid .card{width:100%}
.khero{margin:0 var(--pad) 24px;padding:24px 26px;border-radius:22px;background:linear-gradient(135deg,#ffd166,#f97316 60%,#ef476f);color:#1b1035;display:flex;align-items:center;gap:18px}
.khero svg{width:84px;height:84px;border-radius:18px;flex:none}
.khero h1{font-size:clamp(32px,5vw,54px);margin:0;font-weight:900}
.khero p{font-size:clamp(17px,2vw,22px);margin:4px 0 0;font-weight:700}

/* ---------- hero card ---------- */
.hero{position:relative;margin:calc(132px + env(safe-area-inset-top)) var(--pad) 28px;border-radius:18px;overflow:hidden;background:#111;border:1px solid #ffffff26;aspect-ratio:16/7;max-height:72vh;box-shadow:0 20px 50px #000b}
@media(max-width:700px){.hero{aspect-ratio:3/4.1}}
.hero .bg{position:absolute;top:-50px;right:-50px;bottom:-50px;left:-50px;background-size:cover;background-position:center;filter:blur(30px) saturate(1.5) brightness(.75);transition:background-image .6s}
.hero .art{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:52%;aspect-ratio:16/9;background:center/contain no-repeat;filter:drop-shadow(0 12px 30px #000c)}
.hero .art.poster{width:auto;height:56%;aspect-ratio:2/3;background-size:cover;border-radius:12px;box-shadow:0 20px 50px #000c;filter:none}
@media(min-width:701px){.hero .art{top:45%;width:30%}.hero .art.poster{height:62%}}
.hero .shade{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(0deg,#000f 0%,#000a 30%,#0000 62%)}
.hero .badge{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:8px}
.hero .txt{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 22px;text-align:center}
.hero h1{font-size:clamp(30px,4.6vw,58px);font-weight:900;margin:0 0 8px;letter-spacing:-1px;text-shadow:0 4px 24px #000;line-height:1.05}
.tags{color:#d2d6dc;font-size:clamp(15px,1.4vw,18px);margin:0 0 16px;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px}
.tags b{color:#fff;font-weight:800}
.tags i{font-style:normal;opacity:.45}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;margin:0 auto}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:13px 18px;font-weight:800;font-size:17px}
.b.play{background:#fff;color:#000}
.cta .b{white-space:nowrap}
@media(max-width:420px){.cta .b{font-size:16px;padding:13px 10px}}
.b.play:hover{background:#ffffffd9}
.b.ghost{background:#ffffff33;color:#fff}
.b.ghost:hover{background:#ffffff4d}
.dots{position:absolute;top:22px;right:16px;display:flex;gap:5px}
.dots span{width:16px;height:3px;background:#ffffff55;border-radius:2px}
.dots span.on{background:#fff}

/* ---------- rows ---------- */
main{position:relative;z-index:2}
.rows{position:relative}
.row{margin:0 0 30px}
.row h2{display:flex;align-items:baseline;gap:12px;margin:0 var(--pad) 10px;font-size:clamp(17px,1.6vw,22px);font-weight:800}
.row h2 button{background:none;border:0;color:var(--yellow);font-size:13px;font-weight:700;padding:4px 6px;border-radius:6px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:10px var(--pad) 18px;scroll-padding:0 var(--pad);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip>*{scroll-snap-align:start;flex:none}

/* ---------- cards ---------- */
.card{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--card);text-align:left;transition:transform .2s,box-shadow .2s,opacity .4s;width:clamp(150px,17vw,250px);aspect-ratio:16/9}
.card.poster{width:clamp(112px,11vw,170px);aspect-ratio:2/3}
.card.vid .art img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover;filter:none}
.card.sq{width:clamp(120px,12vw,180px);aspect-ratio:1}
.card.sq .art img{max-width:70%;max-height:62%;border-radius:10px}
.grid.sqs{grid-template-columns:repeat(auto-fill,minmax(clamp(120px,12vw,180px),1fr))}
.card .radio{position:absolute;top:7px;left:7px;background:var(--green);color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:.6px}
.card:hover,.card:focus-visible{transform:scale(1.07);z-index:3;box-shadow:0 12px 30px #000c}
.card:focus-visible{outline:3px solid var(--yellow);outline-offset:0}
.card .art{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center}
.card .art img{max-width:62%;max-height:56%;object-fit:contain;filter:drop-shadow(0 4px 10px #0009)}
.card.poster .art img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover;filter:none}
.card .ini{font-weight:900;font-size:clamp(22px,2.4vw,34px);color:#fff;opacity:.9;letter-spacing:-1px}
.card .lab{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 7px;background:linear-gradient(0deg,#000d,#0000);font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .lab small{display:block;color:#c9ced6;font-weight:500;font-size:11px}
.card .lab small.ep{color:#ffd0d1;overflow:hidden;text-overflow:ellipsis}
.pepg{font-size:13px;color:#dfe3e8;margin-top:4px;line-height:1.35}
.pepg .bar,.gr .bar{display:block;height:3px;background:#ffffff30;border-radius:2px;margin:4px 0;max-width:280px;overflow:hidden}
.pepg .bar b,.gr .bar b{display:block;height:100%;background:var(--red)}
.pepg em,.gr em{font-style:normal;color:var(--muted)}
.glist{display:flex;flex-direction:column;gap:8px}
.gr{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:10px;background:#1b1d22;color:var(--text);padding:10px 14px;text-align:left;font:inherit}
.gr:focus-visible,.gr:hover{background:#2a2d34;outline:2px solid #fff}
.gr .gl{flex:0 0 auto;width:86px;height:48px;border-radius:7px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:900}
.gr .gl img{max-width:84%;max-height:80%}
.gr .gi{flex:1;min-width:0}
.gr .gi b{display:block;font-size:15px}
.gr .gi span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.gr .gi .nx{color:var(--muted);font-size:13px}
.card .live{position:absolute;top:7px;left:7px;background:var(--red);color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:.6px}
.card .star{position:absolute;top:5px;right:8px;color:var(--yellow);text-shadow:0 1px 4px #000}
.card .rank{position:absolute;left:-4px;bottom:-14px;font-size:90px;font-weight:900;color:#000;-webkit-text-stroke:2px #fff8;line-height:1}
.card.gone{opacity:0;transform:scale(.85)}
.skel{width:clamp(150px,17vw,250px);aspect-ratio:16/9;border-radius:10px;background:linear-gradient(90deg,#16191e 0%,#20242b 50%,#16191e 100%);background-size:200% 100%;animation:sh 1.3s infinite}
.skel.poster{width:clamp(112px,11vw,170px);aspect-ratio:2/3}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- pages ---------- */
.page{padding:calc(136px + env(safe-area-inset-top)) var(--pad) 40px}
body.notv .page{padding-top:calc(80px + env(safe-area-inset-top))}
.page h1{font-size:clamp(26px,3vw,40px);margin:0 0 6px;font-weight:900}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.chip.on{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,17vw,250px),1fr));gap:16px 10px}
.grid.posters{grid-template-columns:repeat(auto-fill,minmax(clamp(112px,11vw,170px),1fr))}
.grid .card{width:100%}
.empty{color:var(--muted);text-align:center;padding:60px 10px;font-size:16px}
.more{display:block;margin:24px auto 0}
.sinput{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:10px;color:var(--text);padding:14px 16px;font-size:18px;margin:0 0 20px}
.sinput:focus{border-color:var(--yellow)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 26px}
.box p{margin:0 0 12px;color:var(--muted);font-size:14px}
.oh{font-size:19px;margin:6px 0 12px}
.box .chip{cursor:pointer}
.box .r{display:flex;gap:8px;flex-wrap:wrap}
.box input[type=url],.box input[type=text]{flex:1;min-width:200px;background:var(--bg);border:2px solid var(--line);border-radius:8px;color:var(--text);padding:11px 12px;font-size:15px}
.box label input{display:none}
.spin{width:40px;height:40px;border:4px solid #fff3;border-top-color:var(--yellow);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
footer{color:#6f7782;font-size:12px;text-align:center;padding:10px 20px 40px;line-height:1.7}

/* ---------- player ---------- */
#player{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:#000;display:none}
#player.open{display:block}
#player video{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
.pt,.pb{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;padding:16px var(--pad);transition:opacity .35s;z-index:2}
.pt{top:0;padding-top:calc(16px + env(safe-area-inset-top));background:linear-gradient(#000d,#0000)}
.pb{bottom:60px;justify-content:center;pointer-events:none}
.pb .pbtn{pointer-events:auto}
#player.idle .pt,#player.idle .pb{opacity:0}
#player.idle{cursor:none}
.pbtn{background:#ffffff1f;border:0;border-radius:50%;width:52px;height:52px;font-size:20px;display:inline-flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.pbtn:hover{background:#ffffff38}
.pbtn.fav-on{color:var(--yellow)}
.ptitle{flex:1;min-width:0}
.ptitle b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle small{color:#c9ced6}
.rart{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#1b2a20,#000 70%);pointer-events:none}
#player.radio .rart{display:flex}
#player.radio video{opacity:0}
.rlogo{width:min(46vw,240px);aspect-ratio:1;border-radius:24px;background:#ffffff12 center/70% no-repeat;box-shadow:0 20px 60px #000a;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;color:var(--yellow)}
.rart b{font-size:clamp(22px,3vw,34px);text-align:center;padding:0 20px}
.eq{display:flex;gap:5px;height:34px;align-items:flex-end}
.eq i{width:7px;background:var(--green);border-radius:3px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
@keyframes eq{0%,100%{height:8px}50%{height:34px}}
#player.radio video{pointer-events:auto}
#ytf{position:absolute;left:0;right:0;bottom:0;top:calc(78px + env(safe-area-inset-top));width:100%;height:calc(100% - 78px - env(safe-area-inset-top));border:0;display:none;background:#000}
#player.yt #ytf{display:block}
#player.yt video,#player.yt .pb,#player.yt .subs{display:none}
#player.yt .pt{background:#000}
.subs{position:absolute;left:5%;right:5%;bottom:140px;text-align:center;z-index:1;pointer-events:none}
.subs span{background:#000c;color:#fff;padding:3px 10px;border-radius:6px;font-size:clamp(17px,2.6vw,30px);line-height:1.55;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#player.idle .subs{bottom:60px}
video::cue{background:#000c;color:#fff;font-size:clamp(17px,2.6vw,30px)}
.toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid #ffffff30;padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;z-index:3;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.pbtn.sub-on{background:var(--yellow);color:#000}
.pmsg{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:700;font-size:18px;background:#000a;z-index:1}
.pmsg.show{display:flex}

/* ---------- light mode (TVs) ---------- */
.lite *{transition:none!important}
.lite .hero .bg{filter:none;opacity:.28}
.lite .hero .art,.lite .card .art img{filter:none}
.lite .hero,.lite .card,.lite #bnav,.lite .hero .art.poster{box-shadow:none}
.lite #bnav,.lite .pbtn{backdrop-filter:none;-webkit-backdrop-filter:none}
.lite #bnav{background:#22252b}
.lite .card:hover,.lite .card:focus-visible{transform:none}
.lite .skel{animation:none}
.lite .rays{display:none}
.lite #intro.play .ibox{animation:iinlite 1.4s ease forwards}
@keyframes iinlite{0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* ---------- older iPads / Safari (no aspect-ratio, clamp or flex gap) ---------- */
@supports not (aspect-ratio: 1 / 1){
  .strip>*{margin-right:10px}
  .tb>*{margin-right:12px}
  .chips-top button{margin-right:10px}
  #bnav button{margin:0 2px}
  .card,.skel{width:210px;height:118px}
  .card.poster,.skel.poster{width:140px;height:210px}
  .card.sq{width:160px;height:160px}
  .card.vid{width:210px;height:118px}
  body.kids .card{width:300px;height:169px}
  body.kids .grid .card{width:auto;height:0;padding-top:56.25%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));grid-gap:16px 10px}
  .grid.posters{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .grid.sqs{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .grid .card{width:auto;height:0;padding-top:56.25%}
  .grid .card.poster{padding-top:150%}
  .grid .card.sq{padding-top:100%}
  .hero{height:62vw;max-height:72vh}
  .hero .art{width:46%;height:26vw}
  .hero .art.poster{width:28vw;height:42vw}
  .pav{width:170px;height:170px}
  .pgrid .prof{margin:0 24px}

var probeQ = [], probeBusy = 0, probing = {};
function probe(items){
  if(!(window.Hls && Hls.isSupported())) return;     // Safari/iPhone: rely on playback failures
  items.forEach(function(it){
    if(it.type === "live" && !okc[it.url] && !isDead(it.url) && !probing[it.url]){ probing[it.url] = 1; probeQ.push(it); }
  });

}
function probeNext(){
  var it = probeQ.shift(); if(!it) return;
  probeBusy++;

  var modes = viaOf(it) === "p" ? ["p"] : (streamBase() && !isBBC(it) ? ["d", "p"] : ["d"]);
  function attempt(i){
    if(i >= modes.length) return Promise.reject(0);
    return fetch(src(it, modes[i]), {signal:ctl.signal, cache:"no-store"}).then(function(r){
      if(!r.ok) throw 0;
      try{ r.body && r.body.cancel(); }catch(e){}
      if(modes[i] === "p") setVia(it, "p");
    }).catch(function(){ return attempt(i + 1); });
  }
  attempt(0).then(function(){ markOk(it.url); }, function(){ if(/\bbbc\b/i.test(it.name)) return; markDead(it.url); hideEverywhere(it.url); })   // BBC: only hide after a real try
  .then(function(){ clearTimeout(to); probeBusy--; delete probing[it.url]; probeNext(); });
}

/* ---------- subtitles: Auto (PT, else EN translated to PT, else EN) / EN / off ---------- */
var subPref = sget("subs", "auto"), subText = "", trPromise = null, trCache = {}, toastT = null;
function toast(t){ var el = $("ptoast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove("show"); }, 2600); }
function langOf(l, label, kind){
  var x = ((l || "") + " " + (label || "")).toLowerCase();
  if(/^(pt|por)\b|portugu/.test(x)) return "pt";
  if(/^(es|spa)\b|espa|spanish|castell/.test(x)) return "es";
  if(/^(en|eng)\b|english|^cc\d|caption/.test(x) || kind === "captions") return "en";
  return "x";
}
function getTranslator(){
  if(trPromise) return trPromise;
  if(!("Translator" in self)) return (trPromise = Promise.resolve(null));
  var made = Translator.availability({sourceLanguage:"en", targetLanguage:"pt"}).then(function(a){
    if(a === "unavailable") return null;
    return Translator.create({sourceLanguage:"en", targetLanguage:"pt"});
  });
  var timeout = new Promise(function(res){ setTimeout(function(){ res("wait"); }, 8000); });
  trPromise = Promise.race([made, timeout]).then(function(t){
    if(t === "wait"){ trPromise = null; made.then(function(x){ if(x) trPromise = Promise.resolve(x); }).catch(function(){}); return null; }
    if(!t){ noTr = true; if(player.classList.contains("open")) applySubs(true); }
    return t;
  }).catch(function(){ noTr = true; if(player.classList.contains("open")) applySubs(true); return null; });
  return trPromise;
}
var noTr = false;
function canTranslate(){ return "Translator" in self && !noTr; }
function showText(t){ $("subs").innerHTML = t ? "<span>" + esc(t).replace(/\n/g, "<br>") + "</span>" : ""; }
function onCue(){
  var cues = this.activeCues ? [].slice.call(this.activeCues) : [];
  var text = cues.map(function(c){ return c.text || ""; }).join("\n").replace(/<[^>]+>/g, "").trim();
  subText = text;
  if(!text) return showText("");
  if(trCache[text]) return showText(trCache[text]);
  showText(text);                                  // English straight away, Portuguese as soon as it is translated
  getTranslator().then(function(tr){
    if(!tr) return showText(text);
    return tr.translate(text).then(function(out){ trCache[text] = out; if(subText === text) showText(out); });
  }).catch(function(){ if(subText === text) showText(text); });
}
function applySubs(silent){
  var tracks = [].slice.call(video.textTracks || []), pt = null, en = null;
  tracks.forEach(function(t){ var l = langOf(t.language, t.label, t.kind); if(l === "pt" && !pt) pt = t; if(l === "en" && !en) en = t; });
  var show = null, translate = false;
  if(subPref === "auto"){ show = pt || en; translate = !pt && !!en && canTranslate(); }
  else if(subPref === "en"){ show = en || pt; }
  // hls.js subtitle playlists: tell it which one to load
  if(hls && hls.subtitleTracks && hls.subtitleTracks.length){
    var idx = -1;
    hls.subtitleTracks.forEach(function(t, i){ if(idx < 0 && show && langOf(t.lang, t.name) === langOf(show.language, show.label, show.kind)) idx = i; });
    hls.subtitleDisplay = !translate;
    if(hls.subtitleTrack !== idx) hls.subtitleTrack = idx;
  }
  tracks.forEach(function(t){ t.oncuechange = null; if(t !== show) t.mode = "disabled"; });
  showText("");
  if(show){
    show.mode = translate ? "hidden" : "showing";
    if(translate) show.oncuechange = onCue;
  }
  $("bSub").classList.toggle("sub-on", !!show);
  $("bSub").textContent = !show ? "CC" : translate || show === pt ? "PT" : "EN";
  if(!silent){
    if(subPref === "off") toast("Legendas desligadas");
    else if(!tracks.length) toast("Este canal não tem legendas");
    else if(show === pt) toast("Legendas em português");
    else if(translate) toast("Legendas traduzidas para português");
    else if(show) toast(subPref === "auto" ? "Só há legendas em inglês" : "Legendas em inglês");
  }
}
function addFileSubs(list, tok){
  (list || []).slice(0, 4).forEach(function(sb){
    fetch(sb.url).then(function(r){ return r.text(); }).then(function(t){
      if(tok !== playTok) return;
      if(!/^WEBVTT/.test(t.trim())) t = "WEBVTT\n\n" + t.replace(/\r/g, "").replace(/(\d+:\d+:\d+),(\d+)/g, "$1.$2");
      var tr = document.createElement("track");
      tr.kind = "subtitles"; tr.srclang = sb.lang; tr.label = sb.lang === "pt" ? "Português" : sb.lang === "es" ? "Español" : "English";
      tr.src = URL.createObjectURL(new Blob([t], {type:"text/vtt"}));

}

  bFav.textContent = isFav(current) ? "★" : "☆"; bFav.classList.toggle("fav-on", isFav(current));
  addRecent(current);
  $("bSub").style.display = current.type === "radio" ? "none" : ""; $("bSub").textContent = "CC"; $("bSub").classList.remove("sub-on");
  if(subPref === "auto" && current.type !== "radio" && canTranslate()) getTranslator();
  stopMedia(); wake();
  msg('<div><div class="spin"></div>A abrir ' + esc(current.name) + "…</div>");
  if(!document.activeElement || !player.contains(document.activeElement)) $("bNext").focus({preventScroll:true});
  if(current.type === "yt"){
    msg("");
    var cc = subPref === "off" ? "" : "&cc_load_policy=1&cc_lang_pref=" + (subPref === "auto" ? "pt" : "en");
    $("ytf").src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(current.id) + "?autoplay=1&rel=0&modestbranding=1&playsinline=1&hl=pt" + cc;
    $("bBack").focus({preventScroll:true});
    return;
  }
  if(current.type === "ia") iaVideoUrl(current.id).then(function(u){ if(tok === playTok){ start(u.url, tok); addFileSubs(u.subs, tok); } }).catch(function(){ if(tok === playTok) failed(tok); });
  else if(current.type === "live" || current.type === "radio") startLive(tok);
  else start(src(current), tok);
}
function startLive(tok){
  var mode = viaOf(current);
  start(src(current, mode), tok, function(){
    if(mode === "d" && streamBase() && !isBBC(current)){                // direct did not work: try through the bridge
      mode = "p"; setVia(current, "p"); stopMedia();
      msg('<div><div class="spin"></div>A tentar pela ponte…</div>');
      start(src(current, "p"), tok);
    } else failed(tok);
  });
}
var lastErr = "";
function start(url, tok, onFail){
  var fail = function(){ if(tok === playTok){ if(onFail){ var f = onFail; onFail = null; f(); } else failed(tok); } };
  playTimer = setTimeout(function(){ if(tok === playTok && video.readyState < 2) fail(); }, PLAY_TIMEOUT);
  video.oncanplay = function(){ if(tok !== playTok) return; clearTimeout(playTimer); msg(""); wake(); if(current.type === "live" || current.type === "radio") markOk(current.url); };
  var direct = current.type === "radio" ? !current.hls : /\.(mp4|webm|ogv|mov)(\?|$)/i.test(url);
  if(!direct && window.Hls && Hls.isSupported()){
    var rec = false;
    hls = new Hls({maxBufferLength:30, enableWorker:true});
    hls.on(Hls.Events.ERROR, function(ev, d){
      if(!d.fatal) return;
      lastErr = (d.details || d.type || "erro") + (d.response && d.response.code != null ? " " + d.response.code : "") + (/ftv\.local|forreta-ponte/.test(url) ? " · ponte" : " · direto");
      if(d.type === Hls.ErrorTypes.MEDIA_ERROR && !rec){ rec = true; hls.recoverMediaError(); } else fail();
    });
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play().catch(function(){}); });
    hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, function(){ setTimeout(applySubs, 50); });
    hls.loadSource(url); hls.attachMedia(video);
  } else {
    video.onerror = fail; video.src = url; video.play().catch(function(){});
  }
}
function failed(tok){
  clearTimeout(playTimer);
  if(current.type === "live" || current.type === "radio"){
    markDead(current.url); hideEverywhere(current.url);
    msg((current.type === "radio" ? "Esta rádio" : "Este canal") + " não está a dar agora.<br>Fica escondida até amanhã. A passar à seguinte…".replace("escondida", current.type === "radio" ? "escondida" : "escondido").replace("à seguinte", current.type === "radio" ? "à seguinte" : "ao seguinte") +
      (lastErr ? '<br><small style="opacity:.7;font-size:14px">(' + esc(lastErr) + ")</small>" : ""));
    lastErr = "";
    setTimeout(function(){ if(tok === playTok) step(1); }, 5000);
  } else msg("Não consegui abrir este filme. Experimenta outro.");
}
function step(d){
  if(!queue.length) return;
  var i = qi;
  for(var n = 0; n < queue.length; n++){
    i = (i + d + queue.length) % queue.length;
    if((queue[i].type !== "live" && queue[i].type !== "radio") || !isDead(queue[i].url)) return play(queue, i);
  }
  msg("Não há mais nada a dar nesta fila.");
}
function closePlayer(silent){
  playTok++; stopMedia(); msg("");
  player.classList.remove("open"); document.body.classList.remove("locked");
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  if(!silent){
    if(page === "home" && $("rRecent") == null && recent.length){ /* refresh home so "Continuar a ver" appears */ go("home"); return; }
    if(lastFocus && document.contains(lastFocus) && lastFocus.offsetParent !== null) lastFocus.focus({preventScroll:true});
  }
}
$("bBack").onclick = function(){ closePlayer(); };
$("bPrev").onclick = function(){ step(-1); };
$("bNext").onclick = function(){ step(1); };
bFav.onclick = function(){
  if(!current) return; toggleFav(current);
  var on = isFav(current); bFav.textContent = on ? "★" : "☆"; bFav.classList.toggle("fav-on", on);
  [].forEach.call(document.querySelectorAll('.card[data-k="' + CSS.escape(keyOf(current)) + '"]'), function(c){
    var s = c.querySelector(".star"); if(on && !s) c.insertAdjacentHTML("beforeend", '<span class="star">★</span>'); if(!on && s) s.remove();
  });
};
// AirPlay: send the stream itself to the Apple TV (it plays it directly, no screen-mirroring delay)
if(window.WebKitPlaybackTargetAvailabilityEvent){
  video.addEventListener("webkitplaybacktargetavailabilitychanged", function(e){
    $("bAir").style.display = e.availability === "available" ? "" : "none";
  });
  $("bAir").onclick = function(){ try{ video.webkitShowPlaybackTargetPicker(); }catch(e){} };
}
$("bFull").onclick = function(){
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else if(player.requestFullscreen) player.requestFullscreen().catch(function(){});
    else if(video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  }catch(e){}
};

/* ================= remote / keyboard ================= */
function vis(el){ var r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && el.offsetParent !== null && !el.classList.contains("gone"); }
function move(dir){
  var scope = $("profiles").classList.contains("show") ? $("profiles") : player.classList.contains("open") ? player : document;
  var els = [].filter.call(scope.querySelectorAll(".nav"), function(el){ return vis(el) && (scope !== document || !player.contains(el)); });
  var cur = document.activeElement;
  if(els.indexOf(cur) < 0){
    var f = els.filter(function(x){ return x.id === "hplay" || x.classList.contains("card"); })[0] || els[0];
    if(f){ f.focus({preventScroll:true}); f.scrollIntoView({block:"center", inline:"nearest", behavior:"smooth"}); }
    return;
  }
  var r = cur.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2, best = null, bd = Infinity;
  var horiz = dir === "ArrowLeft" || dir === "ArrowRight";
  els.forEach(function(el){
    if(el === cur) return;
    var b = el.getBoundingClientRect(), dx = b.left + b.width/2 - cx, dy = b.top + b.height/2 - cy;
    var ok = dir === "ArrowRight" ? dx > 4 : dir === "ArrowLeft" ? dx < -4 : dir === "ArrowDown" ? dy > 4 : dy < -4;
    if(!ok) return;
    // horizontal: must stay on (roughly) the same row
    if(horiz && Math.abs(dy) > Math.max(r.height, b.height) * 0.6) return;
    var d = horiz ? Math.abs(dx) + Math.abs(dy) * 3 : Math.abs(dy) + Math.abs(dx) * 0.5;
    if(d < bd){ bd = d; best = el; }
  });
  if(best){
    best.focus({preventScroll:true});
    var inStrip = best.parentElement && best.parentElement.classList.contains("strip");
    best.scrollIntoView({block:best.closest("#top") ? "nearest" : "center", inline:inStrip ? "center" : "nearest", behavior:"smooth"});
    if(best.closest("#hero")) window.scrollTo({top:0, behavior:"smooth"});
  }
}
document.addEventListener("keydown", function(e){
  var k = e.key, a = document.activeElement, typing = a && a.tagName === "INPUT" && a.type !== "file";
  var open = player.classList.contains("open");
  if(open) wake();
  if(k === "Escape" || k === "BrowserBack" || k === "GoBack" || (k === "Backspace" && !typing)){
    e.preventDefault();
    if(open) closePlayer(); else if(typing) a.blur(); else if(page !== "home") go("home");
    return;
  }
  if(open && (k === "PageDown" || k === "ChannelDown" || k === "MediaTrackNext")){ e.preventDefault(); step(1); return; }
  if(open && (k === "PageUp" || k === "ChannelUp" || k === "MediaTrackPrevious")){ e.preventDefault(); step(-1); return; }
  if(typing && (k === "ArrowLeft" || k === "ArrowRight")) return;
  if(k.indexOf("Arrow") === 0){
    if(a === video) return;
    e.preventDefault(); move(k); return;
  }
  if(k === "Enter" && a && a.tagName === "LABEL"){ e.preventDefault(); a.click(); }
});

/* ================= start ================= */
(function(){
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' + document.getElementById("lg").innerHTML + "</svg>";
  $("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
})();
// Android TV app "back" button: one step back inside the app; false = leave the app
window.ftvBack = function(){
  if(player.classList.contains("open")){ closePlayer(); return true; }
  if($("profiles").classList.contains("show")) return false;
  if(page !== "home" && page !== "khome"){ go(profile === "kids" ? "khome" : "home"); return true; }
  return false;
};
var MODE_ID = ON_TV_APP ? "tv-local-5" : "web-direct-5";
if(sget("modeId", "") !== MODE_ID){ dead = {}; okc = {}; via = {}; sset("dead2", dead); sset("ok", okc); sset("via", via); sset("modeId", MODE_ID); }
/* Network country changed (VPN on/off, another country)? Channels that failed before may work now: check them again. */
(function(){
  try{
    fetch("/cdn-cgi/trace", {cache:"no-store"}).then(function(r){ return r.text(); }).then(function(t){
      var m = /\bloc=([A-Z]{2})/.exec(t); if(!m) return;
      var was = sget("loc", "");
      if(was !== m[1]){
        dead = {}; okc = {}; via = {}; sset("dead2", dead); sset("ok", okc); sset("via", via); sset("loc", m[1]);
        if(was && /^(pt|uk|kids|home)$/.test(page)) go(page);
      }
    }).catch(function(){});
  }catch(e){}
})();
showProfiles();
proxyReady = checkAutoProxy();
setTimeout(dailyRefresh, 5000);
setInterval(dailyRefresh, 6 * 3600e3);
})();

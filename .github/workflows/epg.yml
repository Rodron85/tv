name: Guia TV (agora / a seguir)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir guia
        run: python3 scripts/epg.py
      - name: Guardar
        run: |
          git config user.name "Forreta TV"
          git config user.email "noreply@github.com"
          git add public/epg.json
          git commit -m "Guia TV atualizado" || exit 0
          git pull --rebase -q origin master
          git push

name: Construir APK (Android TV)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construir
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ForretaTV.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: ForretaTV-apk
          path: ForretaTV.apk

      - name: Publicar para descarregar na TV
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Forreta TV (Android TV) ${{ github.run_number }}
          make_latest: true
          files: ForretaTV.apk

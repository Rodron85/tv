plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.forreta.tv'
    compileSdk 34

    defaultConfig {
        applicationId "pt.forreta.tv"
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("BUILD_NUMBER") ?: "1")
        versionName "1." + (System.getenv("BUILD_NUMBER") ?: "0")
    }

    // one fixed key, so every new version installs over the previous one on the TV
    signingConfigs {
        forreta {
            storeFile file('forreta.keystore')
            storePassword 'forreta-tv'
            keyAlias 'forreta'
            keyPassword 'forreta-tv'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.forreta }
        release { minifyEnabled false; signingConfig signingConfigs.forreta }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
